popst:
  tags:
    - app
  summary: A json array of cookies to send when downloading .torrent files.
  externalDocs:
    url: "https://github.com/qbittorrent/qBittorrent/wiki/WebUI-API-(qBittorrent-5.0)#set-cookies"
    description: WebUI-API on qBittorrent wiki
  operationId: appSetCookies
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items: 
            $ref: "../../schemas/app/Cookies.yaml"
          description: The cookies configuration
          example: |
            [
                {
                    "name":"Example",
                    "domain":"example.com",
                    "path":"/",
                    "value":"foo=bar"
                    "expirationDate":1507969127,
                },
            ]
    required: true
  responses:
    "200":
      description: Cookies were saved
    "400":
      description: Request was not a valid json array of cookie objects
  security:
    - sid: []
